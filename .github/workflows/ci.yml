name: Fleet Pulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Quality, Linter, Typecheck & Unit Tests with Coverage Thresholds
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fleet-pulse/api prisma:generate

      - name: Lint all packages
        run: pnpm lint

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Unit tests & coverage: Shared Package (Geo Threshold >= 95%)
        run: pnpm --filter @fleet-pulse/shared test -- --coverage

      - name: Unit tests: Mobile Driver App
        run: pnpm --filter @fleet-pulse/mobile test

      - name: Unit tests & coverage: API (Dispatch Strategies Threshold >= 90%)
        run: pnpm --filter @fleet-pulse/api test -- --coverage --collectCoverageFrom="modules/dispatch/strategies/**/*.ts"

  # ---------------------------------------------------------------------------
  # 2. API Integration Tests with PostGIS & Redis Service Containers
  # ---------------------------------------------------------------------------
  integration-api:
    name: API Integration Tests (PostGIS & Redis)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: fleetpulse
          POSTGRES_PASSWORD: fleetpulse_password
          POSTGRES_DB: fleetpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fleetpulse -d fleetpulse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://fleetpulse:fleetpulse_password@localhost:5432/fleetpulse?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: fleetpulse-ci-test-jwt-access-secret-minimum-32-chars-long
      JWT_REFRESH_SECRET: fleetpulse-ci-test-jwt-refresh-secret-minimum-32-chars-long
      PORT: 4000
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @fleet-pulse/shared build

      - name: Apply PostGIS migrations & schema
        run: pnpm --filter @fleet-pulse/api prisma db push

      - name: Seed database
        run: pnpm --filter @fleet-pulse/api prisma:seed

      - name: Run API integration & security E2E tests
        run: pnpm --filter @fleet-pulse/api test:e2e

  # ---------------------------------------------------------------------------
  # 3. Web Dashboard Playwright E2E Tests
  # ---------------------------------------------------------------------------
  e2e-web:
    name: Web Dashboard Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @fleet-pulse/shared build

      - name: Install Playwright browsers with OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E test suite
        run: pnpm --filter @fleet-pulse/web test:e2e

      - name: Upload Playwright report artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Monorepo Production Build
  # ---------------------------------------------------------------------------
  build:
    name: Build Monorepo (Turbo)
    needs: [quality, integration-api, e2e-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @fleet-pulse/api prisma:generate

      - name: Build all apps and packages
        run: pnpm build

  # ---------------------------------------------------------------------------
  # 5. Production Docker Image Build for API
  # ---------------------------------------------------------------------------
  docker-api:
    name: Docker Image Build (API)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: fleet-pulse-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
